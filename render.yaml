services:
  - type: web
    name: sujith-reddy-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        value: sujithreddygade86@gmail.com
